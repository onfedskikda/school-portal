<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم - فضاء التلميذ</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 0;
    }
    header {
      background: #006699;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .card:hover {
      background: #e6f7ff;
      transform: scale(1.05);
    }
    .card:nth-child(1) { background: #ffe6e6; }
    .card:nth-child(2) { background: #e6ffe6; }
    .card:nth-child(3) { background: #e6e6ff; }
    .card:nth-child(4) { background: #fff0e6; }
    .card:nth-child(5) { background: #f9e6ff; }
    .card:nth-child(6) { background: #e6f9ff; }
    .card:nth-child(7) { background: #ffffe6; }
  </style>
</head>
<body>
  <header>بوابة التلميذ</header>
  <div class="container">
    <div class="card">📑 تسجيلاتي</div>
    <div class="card">📝 كشوف النقاط</div>
    <div class="card">📊 نقاط الرقابة المستمرة، الفروض و الاختبارات</div>
    <div class="card">📚 مواضيع الفروض و الإختبارات</div>
    <div class="card">🎓 الامتحانات الرسمية</div>
    <div class="card">⏰ توقيت الفروض و الاختبارات</div>
    <div class="card">🔄 طلبات التحويل</div>
  </div>
</body>
</html>
