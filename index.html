<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول - Diwan</title>
  <script type="module">
    // استيراد Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    // إعدادات مشروعك من Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyB5C8Z8rsRb-wsLv1-Pv5Whqqc3z7NkzrA",
      authDomain: "diwan-8bec0.firebaseapp.com",
      projectId: "diwan-8bec0",
      storageBucket: "diwan-8bec0.firebasestorage.app",
      messagingSenderId: "144048154405",
      appId: "1:144048154405:web:3ba53185d382040b135ccc",
      measurementId: "G-LPC1TFTWFT"
    };

    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // عند الضغط على زر تسجيل الدخول
    window.login = function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("تم تسجيل الدخول بنجاح ✅");
          // هنا تقدر توجه المستخدم إلى صفحة أخرى أو تظهر له الخانات
          document.getElementById("login-box").style.display = "none";
          document.getElementById("main-content").style.display = "block";
        })
        .catch((error) => {
          alert("خطأ: " + error.message);
        });
    };
  </script>
</head>
<body>
  <h2>تسجيل الدخول</h2>
  <div id="login-box">
    <input type="email" id="email" placeholder="البريد الإلكتروني"><br><br>
    <input type="password" id="password" placeholder="كلمة المرور"><br><br>
    <button onclick="login()">دخول</button>
  </div>

  <!-- المحتوى بعد تسجيل الدخول -->
  <div id="main-content" style="display:none;">
    <h3>مرحبا بك 👋</h3>
    <ul>
      <li><a href="#">تسجيلاتي</a></li>
      <li><a href="#">كشوف النقاط</a></li>
      <li><a href="#">الإعلانات</a></li>
    </ul>
  </div>
</body>
</html>
