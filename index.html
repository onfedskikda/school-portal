<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Cairo', sans-serif;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #dfe6e9; /* رمادي بارد جدا */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      width: 420px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      opacity: 0;
      transform: translateY(50px);
      animation: slideUp 1s ease forwards;
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 10px;
    }

    .header-text {
      text-align: right;
      font-size: 14px;
      line-height: 1.4;
    }

    .marquee {
      background: #2ecc71; /* أخضر بارد */
      color: #2980b9; /* أزرق بارد */
      padding: 6px;
      border-radius: 6px;
      overflow: hidden;
      white-space: nowrap;
      margin-bottom: 20px;
    }

    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: scroll 15s linear infinite; /* بطيء */
    }

    @keyframes scroll {
      from { transform: translateX(0%); }
      to { transform: translateX(-100%); }
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      gap: 8px;
    }

    .btn {
      flex: 1;
      border: none;
      padding: 10px;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    .btn:hover {
      opacity: 0.8;
    }

    .blue { background: #3498db; }
    .pink { background: #e84393; }
    .yellow { background: #f1c40f; color: #000; }

    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      display: none;
    }

    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="header-text">
        الجمهورية الجزائرية الديمقراطية الشعبية <br>
        وزارة التربية الوطنية <br>
        الديوان الوطني للتعليم والتكوين عن بعد
      </div>
    </div>

    <div class="marquee"><span>مرحباً بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</span></div>

    <input type="text" id="regNum" placeholder="رقم التسجيل">
    <input type="password" id="password" placeholder="الرقم السري">

    <div class="buttons">
      <button class="btn blue" onclick="login()">تسجيل الدخول</button>
      <button class="btn pink">تسجيل جديد</button>
      <button class="btn yellow">استعادة كلمة المرور</button>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script>
    function login() {
      const regNum = document.getElementById("regNum").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("message");

      if (regNum === "21202505167" && password === "21Ut17174L#U") {
        msg.style.display = "block";
        msg.textContent = "✅ تم تسجيل الدخول بنجاح";
        msg.className = "message success";

        setTimeout(() => {
          window.location.href = "page2.html"; // الصفحة التالية
        }, 500);
      } else {
        msg.style.display = "block";
        msg.textContent = "❌ رقم التسجيل أو كلمة المرور خاطئة";
        msg.className = "message error";
      }
    }
  </script>
</body>
</html>
