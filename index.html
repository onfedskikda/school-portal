<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الديوان الوطني للتعليم والتكوين عن بعد</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .header h2 {
            color: #006633;
            margin-bottom: 10px;
        }
        
        .login-form {
            text-align: right;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        
        .login-btn {
            background-color: #006633;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .login-btn:hover {
            background-color: #004d26;
        }
        
        .success-message {
            color: #006633;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>الجمهورية الجزائرية الديمقراطية الشعبية</h2>
            <h3>وزارة التربية الوطنية</h3>
            <h4>الدوين الوطني للتعليم والتكوين عن بعد</h4>
            <p>مرحباً بكم في الأرضية الرقمية</p>
        </div>
        
        <div class="login-form">
            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم">
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور">
            </div>
            
            <button class="login-btn" onclick="login()">تسجيل الدخول</button>
            
            <div id="successMessage" class="success-message">
                تم تسجيل الدخول بنجاح
            </div>
        </div>
    </div>

    <script>
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // في الواقع هنا يجب التحقق من صحة البيانات مع الخادم
            if (username && password) {
                document.getElementById('successMessage').style.display = 'block';
                
                // الانتقال إلى الصفحة التالية بعد 0.5 ثانية
                setTimeout(function() {
                    window.location.href = "الصفحة الثانية.html";
                }, 500);
            } else {
                alert('يرجى إدخال اسم المستخدم وكلمة المرور');
            }
        }
        
        // السماح بالدخول بالزر Enter
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
