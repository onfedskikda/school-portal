<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ</title>
  <!-- خط أنيق -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #ffffff);
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    header {
      margin-bottom: 30px;
    }
    header img {
      height: 120px;
      margin: 10px;
    }
    h1 {
      color: #00796b;
      margin: 15px 0;
    }
    p {
      color: #444;
      font-size: 18px;
      margin-bottom: 20px;
    }
    .login-box {
      background: #ffffffcc;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 350px;
      margin: auto;
    }
    .login-box input {
      display: block;
      width: 90%;
      margin: 10px auto;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    .login-box button {
      background: #00796b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    .login-box button:hover {
      background: #004d40;
    }
  </style>
</head>
<body>
  <header>
    <!-- صورة كتب -->
    <img src="https://cdn-icons-png.flaticon.com/512/29/29302.png" alt="كتب">
    <!-- صورة خريطة الجزائر -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/77/Algeria_relief_location_map.jpg" alt="خريطة الجزائر">
    <h1>فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</h1>
    <p>منصة لمتابعة النتائج، التسجيلات، وكشوف النقاط.</p>
  </header>

  <div class="login-box">
    <h2>تسجيل الدخول</h2>
    <form>
      <input type="text" placeholder="البريد الإلكتروني أو رقم التسجيل">
      <input type="password" placeholder="كلمة المرور">
      <button type="submit">دخول</button>
    </form>
  </div>
</body>
</html>
