<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</title>
  <style>
    body {
      font-family: "Tahoma", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f2f6fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }
    header {
      width: 100%;
      position: relative;
    }
    header img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
    }
    header .flag {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 50px;
    }
    main {
      max-width: 420px;
      background: white;
      margin-top: -50px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      font-size: 20px;
      color: #003366;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #555;
      margin: 8px 0;
    }
    form {
      margin-top: 20px;
      text-align: right;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0066ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0047b3;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://i.imgur.com/2nCt3Sbl.jpg" alt="كتب مدرسية" />
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/77/Flag_of_Algeria.svg" class="flag" alt="علم الجزائر" />
  </header>
  <main>
    <h1>فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</h1>
    <p>منصة لمتابعة نتائج التلاميذ، الغيابات، المواعيد وطلبات التحويل.</p>
    <p>أدخل بياناتك الموثقة للدخول إلى الخدمات الرقمية للمدرسة.</p>
    
    <form>
      <input type="text" placeholder="البريد الإلكتروني (مثال: @21202505167)" required />
      <input type="password" placeholder="كلمة المرور" required />
      <button type="submit">دخول</button>
    </form>
  </main>
</body>
</html>
