<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</title>
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/2/27/School_library.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .header {
      display: flex;
      align-items: center;
      background: white;
      padding: 10px 20px;
    }
    .header img {
      height: 60px;
      margin-left: 15px;
    }
    .header h1 {
      font-size: 20px;
      margin: 0;
      line-height: 1.5;
    }
    .marquee {
      background: #2e8b57; /* أخضر بارد */
      color: white;
      padding: 10px;
      overflow: hidden;
      white-space: nowrap;
    }
    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 20s linear infinite; /* الحركة الآن أبطأ */
      color: #007BFF; /* أزرق بارد */
    }
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      width: 400px;
      margin: 50px auto;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    .card h2 {
      margin-bottom: 20px;
      font-size: 18px;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: 'Cairo', sans-serif;
    }
    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      margin: 5px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
      font-family: 'Cairo', sans-serif;
    }
    .btn-blue { background: #007BFF; }
    .btn-pink { background: #e83e8c; }
    .btn-yellow { background: #ffc107; color: black; }
    .btn:hover { opacity: 0.8; }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <div class="header">
    <!-- ⚠️ ضع هنا رابط شعار الديوان بصيغة PNG أو JPG -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Books-aj.svg_aj_ashton_01.svg/1024px-Books-aj.svg_aj_ashton_01.svg.png" alt="شعار الديوان">
    <h1>
      وزارة التربية الوطنية<br>
      الديوان الوطني للتعليم والتكوين عن بعد
    </h1>
  </div>

  <div class="marquee">
    <span>مرحباً بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</span>
  </div>

  <div class="card">
    <h2>فضاء التلميذ</h2>
    <input type="text" id="regNum" placeholder="رقم التسجيل">
    <input type="password" id="password" placeholder="كلمة المرور">

    <div class="buttons">
      <button class="btn btn-blue" onclick="login()">تسجيل الدخول</button>
      <button class="btn btn-pink">تسجيل جديد</button>
      <button class="btn btn-yellow">إستعادة كلمة المرور</button>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script>
    function login() {
      const regNum = document.getElementById("regNum").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("message");

      if (regNum === "21202505167" && password === "21Ut17174L#U") {
        msg.textContent = "✔ تم تسجيل الدخول بنجاح";
        msg.className = "message success";
        msg.style.display = "block";
      } else {
        msg.textContent = "✖ رقم التسجيل أو كلمة المرور خاطئة";
        msg.className = "message error";
        msg.style.display = "block";
      }
    }
  </script>

</body>
</html>
