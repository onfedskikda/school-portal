<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الديوان الوطني للتعليم والتكوين عن بعد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        @font-face {
            font-family: 'TheSans';
            src: url('https://cdn.jsdelivr.net/gh/mohammed-22/thesans-arabic@main/TheSansArabic-Plain.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
        }

        .premium-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.85));
            backdrop-filter: blur(20px);
            border-radius: 0 0 25px 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            padding: 30px 40px 40px 40px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            transform: translateY(-100%);
            opacity: 0;
            animation: slideDown 1s ease-out 0.3s forwards;
        }

        @keyframes slideDown {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .premium-logo-section {
            margin-bottom: 30px;
            transform: translateY(30px);
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.7s forwards;
        }

        @keyframes fadeInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .premium-national {
            color: #2c3e50;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 5px;
            font-family: 'TheSans', 'Cairo', sans-serif;
        }

        .premium-ministry {
            color: #34495e;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            font-family: 'TheSans', 'Cairo', sans-serif;
        }

        .premium-office {
            color: #3498db;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 15px;
            font-family: 'TheSans', 'Cairo', sans-serif;
        }

        .premium-welcome {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
            font-family: 'TheSans', 'Cairo', sans-serif;
        }

        .premium-welcome::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 25%;
            width: 50%;
            height: 3px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-radius: 10px;
        }

        .international-message {
            color: #2c3e50;
            background: #e8f6f3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            border: 2px solid #00b894;
            text-align: center;
            font-family: 'TheSans', 'Cairo', sans-serif;
            font-size: 18px;
        }

        .premium-form-group {
            margin-bottom: 25px;
            text-align: right;
            position: relative;
            transform: translateY(30px);
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.9s forwards;
        }

        .premium-form-group:nth-child(2) {
            animation-delay: 1.1s;
        }

        .premium-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            font-size: 16px;
            background: #f8f9fa;
            transition: all 0.3s ease;
            font-family: 'TheSans', 'Cairo', sans-serif;
        }

        .premium-input:focus {
            border-color: #3498db;
            background: white;
            outline: none;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
            transform: translateY(-2px);
        }

        .separator {
            height: 2px;
            background: linear-gradient(90deg, transparent, #3498db, transparent);
            margin: 25px 0;
            border: none;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            transform: translateY(30px);
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 1.3s forwards;
        }

        .login-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
            font-family: 'TheSans', 'Cairo', sans-serif;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #2980b9, #1f618d);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.6);
        }

        .register-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'TheSans', 'Cairo', sans-serif;
        }

        .register-btn:hover {
            background: linear-gradient(135deg, #27ae60, #219652);
            transform: translateY(-2px);
        }

        .forgot-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'TheSans', 'Cairo', sans-serif;
        }

        .forgot-btn:hover {
            background: linear-gradient(135deg, #c0392b, #a93226);
            transform: translateY(-2px);
        }

        .error-message {
            color: #e74c3c;
            background: #fadbd8;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
            border: 1px solid #e74c3c;
            text-align: center;
            font-family: 'TheSans', 'Cairo', sans-serif;
            animation: shake 0.5s ease-in-out;
        }

        .success-message {
            color: #27ae60;
            background: #d5f4e6;
            padding: 15px;
            border-radius: 10px;
            margin: 20px auto;
            display: none;
            font-weight: 700;
            border: 2px solid #27ae60;
            text-align: center;
            max-width: 400px;
            font-family: 'TheSans', 'Cairo', sans-serif;
            font-size: 18px;
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
            animation: fadeInUp 0.5s ease-out;
        }

        .success-icon {
            color: #27ae60;
            font-size: 24px;
            margin-left: 10px;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #7f8c8d;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="premium-card">
        <div class="premium-logo-section">
            <div class="premium-national">الجمهورية الجزائرية الديمقراطية الشعبية</div>
            <div class="premium-ministry">وزارة التربية الوطنية</div>
            <div class="premium-office">الديوان الوطني للتعليم والتكوين عن بعد</div>
            <div class="premium-welcome">مرحبا بكم في الأرضية الرقمية</div>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-triangle"></i> إسم المستخدم أو كلمة المرور خاطئة
        </div>

        <form id="loginForm">
            <div class="premium-form-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" class="premium-input" id="username" placeholder="اسم المستخدم" required value="21202505167">
            </div>

            <div class="premium-form-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" class="premium-input" id="password" placeholder="كلمة المرور" required value="21Ut17174L#U">
            </div>

            <hr class="separator">

            <div class="buttons-container">
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
                
                <a href="#" class="register-btn">
                    <i class="fas fa-user-plus"></i> تسجيل جديد
                </a>
                
                <a href="#" class="forgot-btn">
                    <i class="fas fa-key"></i> استعادة كلمة المرور
                </a>
            </div>
        </form>
    </div>

    <div class="success-message" id="successMessage">
        <i class="fas fa-check-circle success-icon"></i>
        تم تسجيل الدخول بنجاح
    </div>

    <script>
        const correctUsername = "21202505167";
        const correctPassword = "21Ut17174L#U";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            if (username === correctUsername && password === correctPassword) {
                errorMessage.style.display = 'none';
                successMessage.style.display = 'block';
                setTimeout(function() {
                    window.location.href = "dashboard.html";
                }, 2000);
            } else {
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            }
        });

        document.getElementById('username').addEventListener('input', function() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        });

        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        });
    </script>
</body>
</html>
