<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f2f5;
    }
    /* شاشة الدخول */
    .login-screen, .dashboard {
      display: none;
      text-align: center;
      padding: 30px;
    }
    .active { display: block; }
    header img {
      height: 80px;
      margin: 10px;
    }
    h1 {
      color: #00796b;
      margin: 15px 0;
    }
    p {
      color: #333;
      font-size: 18px;
      margin-bottom: 25px;
    }
    .login-box {
      background: #ffffffcc;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      max-width: 350px;
      margin: auto;
    }
    .login-box input {
      display: block;
      width: 90%;
      margin: 10px auto;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    .login-box button {
      background: #00796b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    .login-box button:hover {
      background: #004d40;
    }
    /* لوحة التلميذ */
    .dashboard h2 {
      margin-bottom: 20px;
      color: #00796b;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      max-width: 800px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
      font-size: 18px;
    }
    .card:hover {
      transform: translateY(-5px);
      background: #e0f7fa;
    }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div class="login-screen active">
    <header>
      <img src="https://cdn-icons-png.flaticon.com/512/29/29302.png" alt="كتب">
      <h1>فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</h1>
      <p>منصة لمتابعة النتائج، التسجيلات، وكشوف النقاط.</p>
    </header>

    <div class="login-box">
      <h2>تسجيل الدخول</h2>
      <form id="loginForm">
        <input type="text" placeholder="البريد الإلكتروني أو رقم التسجيل" required>
        <input type="password" placeholder="كلمة المرور" required>
        <button type="submit">دخول</button>
      </form>
    </div>
  </div>

  <!-- لوحة التلميذ -->
  <div class="dashboard">
    <h2>📚 لوحة التلميذ</h2>
    <div class="grid">
      <div class="card">📘 تسجيلاتي</div>
      <div class="card">📑 كشوف النقاط</div>
      <div class="card">📝 نماذج الفروض والاختبارات</div>
      <div class="card">📊 نتائج المراقبة المستمرة، الفروض، والاختبارات</div>
      <div class="card">🔄 طلبات التحويل</div>
      <div class="card">❓ طرح إشكاليات</div>
    </div>
  </div>

  <script>
    // عند الضغط على دخول
    document.getElementById("loginForm").addEventListener("submit", function(e){
      e.preventDefault();
      document.querySelector(".login-screen").classList.remove("active");
      document.querySelector(".dashboard").classList.add("active");
    });
  </script>

</body>
</html>
