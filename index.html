<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      padding: 0;
      background: url('https://img.freepik.com/free-vector/school-teacher-kids-classroom-illustration_1308-93193.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding-top: 40px;
    }

    /* طبقة شفافة فوق الصورة */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.7);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: white;
      border-radius: 16px;
      padding: 25px 35px;
      width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      animation: fadeSlide 1.2s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(60px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: right;
      margin-bottom: 15px;
    }

    .header h2 {
      margin: 5px 0;
      font-size: 17px;
      color: #004d40;
    }

    .banner {
      background: #80cbc4;
      padding: 12px;
      overflow: hidden;
      white-space: nowrap;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .banner span {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 25s linear infinite;
      color: #004d40;
    }

    @keyframes marquee {
      from { transform: translateX(100%); }
      to { transform: translateX(-100%); }
    }

    .login-box input {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      transition: 0.3s;
    }

    .login-box input:focus {
      border-color: #009688;
      box-shadow: 0 0 8px rgba(0, 150, 136, 0.3);
      outline: none;
    }

    .login-box button {
      background: linear-gradient(45deg, #009688, #004d40);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      margin-top: 10px;
      transition: 0.4s;
    }

    .login-box button:hover {
      background: linear-gradient(45deg, #004d40, #009688);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h2>الجمهورية الجزائرية الديمقراطية الشعبية</h2>
      <h2>وزارة التربية الوطنية</h2>
      <h2>الديوان الوطني للتعليم والتكوين عن بعد</h2>
    </div>

    <div class="banner">
      <span>مرحباً بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</span>
    </div>

    <div class="login-box">
      <form action="dashboard.html" method="get">
        <input type="text" placeholder="اسم المستخدم" required>
        <input type="password" placeholder="كلمة المرور" required>
        <button type="submit">تسجيل الدخول</button>
      </form>
    </div>
  </div>
</body>
</html>
