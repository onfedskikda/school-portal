<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الديوان الوطني للتعليم والتكوين عن بعد</title>
    <!-- إضافة خط Cairo من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- إضافة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* الشريط الأخضر مع النص المتحرك */
        .header-bar {
            background: #2ecc71;
            padding: 10px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            overflow: hidden;
        }

        .moving-text {
            color: #8e44ad;
            font-weight: bold;
            font-size: 18px;
            white-space: nowrap;
            animation: moveText 20s linear infinite;
        }

        @keyframes moveText {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* البطاقة الرئيسية */
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            transform: translateY(100px);
            opacity: 0;
            animation: slideUp 0.8s ease-out forwards;
            margin-top: 100px;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* الشعار والعناوين */
        .logo-section {
            margin-bottom: 30px;
        }

        .national-title {
            color: #2c3e50;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .ministry-title {
            color: #34495e;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .office-title {
            color: #8e44ad;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .welcome-title {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        /* حقول الإدخال */
        .form-group {
            margin-bottom: 25px;
            text-align: right;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #3498db;
            background: white;
            outline: none;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
        }

        /* زر تسجيل الدخول */
        .login-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #2980b9, #1f618d);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* الروابط */
        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .link {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .link:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        /* رسائل الخطأ */
        .error-message {
            color: #e74c3c;
            background: #fadbd8;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            font-weight: 500;
        }

        /* الـ CAPTCHA */
        .captcha-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bdc3c7;
        }

        .captcha-title {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .captcha-display {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>
    <!-- الشريط الأخضر العلوي -->
    <div class="header-bar">
        <div class="moving-text">
            مرحباً بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد
        </div>
    </div>

    <!-- البطاقة الرئيسية -->
    <div class="login-card">
        <!-- العناوين -->
        <div class="logo-section">
            <div class="national-title">الجمهورية الجزائرية الديمقراطية الشعبية</div>
            <div class="ministry-title">وزارة التربية الوطنية</div>
            <div class="office-title">الديوان الوطني للتعليم والتكوين عن بعد</div>
            <div class="welcome-title">مرحبا بكم في الأرضية الرقمية</div>
        </div>

        <!-- رسالة الخطأ -->
        <div class="error-message" id="errorMessage">
            إسم المستخدم وكلمة المرور غير صحيحة
        </div>

        <!-- نموذج التسجيل -->
        <form id="loginForm">
            <div class="form-group">
                <input type="email" class="input-field" id="email" placeholder="البريد الإلكتروني" required>
            </div>

            <div class="form-group">
                <input type="password" class="input-field" id="password" placeholder="كلمة المرور" required>
            </div>

            <!-- قسم CAPTCHA -->
            <div class="captcha-section">
                <div class="captcha-title">nCAPTCHA</div>
                <div class="captcha-display" id="captchaDisplay">A1B2C3</div>
            </div>

            <button type="submit" class="login-btn">تسجيل الدخول</button>
        </form>

        <!-- الروابط -->
        <div class="links">
            <a href="#" class="link">تسجيل جديد</a>
            <a href="#" class="link">استعادة كلمة المرور</a>
        </div>
    </div>

    <script>
        // تهيئة Firebase
        const firebaseConfig = {
            // هنا ضع إعدادات Firebase الخاصة بك
            apiKey: "your-api-key",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "your-sender-id",
            appId: "your-app-id"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);

        // إدارة نموذج التسجيل
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            // تسجيل الدخول باستخدام Firebase
            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // تم تسجيل الدخول بنجاح
                    const user = userCredential.user;
                    console.log("تم تسجيل الدخول بنجاح:", user);
                    // توجيه المستخدم إلى الصفحة الرئيسية
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    // حدث خطأ في تسجيل الدخول
                    const errorCode = error.code;
                    const errorMessageText = error.message;
                    
                    // عرض رسالة الخطأ
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = 'إسم المستخدم وكلمة المرور غير صحيحة';
                    
                    console.error("خطأ في تسجيل الدخول:", error);
                });
        });

        // إخفاء رسالة الخطأ عند البدء في الكتابة
        document.getElementById('email').addEventListener('input', function() {
            document.getElementById('errorMessage').style.display = 'none';
        });

        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('errorMessage').style.display = 'none';
        });

        // إنشاء CAPTCHA عشوائي
        function generateCaptcha() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let captcha = '';
            for (let i = 0; i < 6; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('captchaDisplay').textContent = captcha;
        }

        // توليد CAPTCHA عند تحميل الصفحة
        generateCaptcha();
    </script>
</body>
</html>
