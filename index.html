<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التلميذ</title>
  <style>
    body {
      margin: 0;
      font-family: "Cairo", Arial, sans-serif;
      background: #f2f4f8;
    }

    header {
      background: #007bff;
      color: white;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      grid-gap: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      padding: 25px 20px;
      text-align: center;
      transition: transform 0.2s ease-in-out;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .icon {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    footer {
      background: #007bff;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 40px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    📚 لوحة التلميذ
  </header>

  <div class="container">
    <div class="card" style="border-top: 5px solid #007bff;">
      <div class="icon">📘</div>
      <div class="title">تسجيلاتي</div>
    </div>

    <div class="card" style="border-top: 5px solid #28a745;">
      <div class="icon">📑</div>
      <div class="title">كشوف النقاط</div>
    </div>

    <div class="card" style="border-top: 5px solid #ffc107;">
      <div class="icon">✏️</div>
      <div class="title">نماذج الفروض والاختبارات</div>
    </div>

    <div class="card" style="border-top: 5px solid #17a2b8;">
      <div class="icon">📊</div>
      <div class="title">نتائج المراقبة المستمرة والفروض والاختبارات</div>
    </div>

    <div class="card" style="border-top: 5px solid #6f42c1;">
      <div class="icon">📂</div>
      <div class="title">طلبات التحويل</div>
    </div>

    <div class="card" style="border-top: 5px solid #dc3545;">
      <div class="icon">❓</div>
      <div class="title">طرح إشكاليات</div>
    </div>
  </div>

  <footer>
    © 2025 - موقع التلميذ
  </footer>

</body>
</html>
