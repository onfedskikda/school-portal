<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      animation: fadeIn 1.5s ease-in-out;
    }
    header img {
      width: 90px;
      margin-bottom: 15px;
    }
    header h1 {
      font-size: 26px;
      margin: 10px 0;
    }
    header p {
      font-size: 18px;
      opacity: 0.9;
    }

    .login-box {
      background: rgba(255,255,255,0.1);
      padding: 25px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
      max-width: 350px;
      width: 90%;
      margin-bottom: 30px;
      animation: slideDown 1.2s ease;
    }
    .login-box input {
      width: 90%;
      margin: 10px auto;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      display: block;
    }
    .login-box button {
      background: #FF9800;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      transition: 0.3s;
    }
    .login-box button:hover {
      background: #e68900;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      width: 90%;
      max-width: 900px;
      margin-bottom: 40px;
      animation: fadeIn 1.5s ease-in-out;
    }
    .card {
      background: #fff;
      color: #333;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s, background 0.3s;
    }
    .card:hover {
      transform: translateY(-8px);
      background: #f0f0f0;
    }

    /* ألوان مختلفة للخانات */
    .card1 { border-top: 6px solid #FF9800; }
    .card2 { border-top: 6px solid #4CAF50; }
    .card3 { border-top: 6px solid #2196F3; }
    .card4 { border-top: 6px solid #E91E63; }
    .card5 { border-top: 6px solid #9C27B0; }
    .card6 { border-top: 6px solid #FFC107; }

    /* أنيميشن */
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
    @keyframes slideDown {
      from {opacity: 0; transform: translateY(-50px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <header>
    <img src="https://cdn-icons-png.flaticon.com/512/29/29302.png" alt="شعار">
    <h1>مرحباً بكم في فضاء التلميذ</h1>
    <p>الديوان الوطني للتعليم والتكوين عن بعد</p>
  </header>

  <div class="login-box">
    <h2>تسجيل الدخول</h2>
    <form>
      <input type="text" placeholder="رقم التسجيل" required>
      <input type="password" placeholder="كلمة المرور" required>
      <button type="submit">دخول</button>
    </form>
  </div>

  <div class="dashboard">
    <div class="card card1">📚 تسجيلاتي</div>
    <div class="card card2">📄 كشوف النقاط</div>
    <div class="card card3">📝 نماذج الفروض والإختبارات</div>
    <div class="card card4">📊 نتائج المراقبة المستمرة</div>
    <div class="card card5">🔄 طلبات التحويل</div>
    <div class="card card6">❓ طرح إشكاليات</div>
  </div>
</body>
</html>
