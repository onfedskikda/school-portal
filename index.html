<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #e0f7fa, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px 40px;
      width: 420px;
      animation: fadeSlide 1.2s ease;
      box-shadow: 0 0 25px rgba(0, 150, 136, 0.3);
      position: relative;
    }

    /* أثر ضوئي متدرج حول البطاقة */
    .card::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 20px;
      background: linear-gradient(45deg, #00e5ff, #00c853, #00bfa5, #00e676);
      background-size: 300% 300%;
      animation: glow 6s ease infinite;
      z-index: -1;
      filter: blur(12px);
    }

    @keyframes glow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(80px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: right;
      margin-bottom: 15px;
    }

    .header h2 {
      margin: 5px 0;
      font-size: 18px;
      color: #004d40;
    }

    .banner {
      background: #80cbc4;
      padding: 12px;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .banner span {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 12s linear infinite;
      background: linear-gradient(90deg, #004d40, #00695c, #26a69a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes marquee {
      from { transform: translateX(100%); }
      to { transform: translateX(-100%); }
    }

    .login-box input {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      transition: 0.3s;
    }

    .login-box input:focus {
      border-color: #009688;
      box-shadow: 0 0 8px rgba(0, 150, 136, 0.4);
      outline: none;
    }

    .login-box button {
      background: linear-gradient(45deg, #009688, #004d40);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      margin-top: 10px;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .login-box button::after {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.3);
      transform: skewX(-30deg);
      transition: 0.4s;
    }

    .login-box button:hover::after {
      left: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h2>الجمهورية الجزائرية الديمقراطية الشعبية</h2>
      <h2>وزارة التربية الوطنية</h2>
      <h2>الديوان الوطني للتعليم والتكوين عن بعد</h2>
    </div>

    <div class="banner">
      <span>مرحباً بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</span>
    </div>

    <div class="login-box">
      <form action="dashboard.html" method="get">
        <input type="text" placeholder="اسم المستخدم" required>
        <input type="password" placeholder="كلمة المرور" required>
        <button type="submit">تسجيل الدخول</button>
      </form>
    </div>
  </div>
</body>
</html>
