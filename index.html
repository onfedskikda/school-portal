<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>منصة التعليم</title>
  <!-- استدعاء خط Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
      background: #ffffff; /* خلفية بيضاء */
    }

    .header {
      text-align: right;
      padding: 20px;
      border-bottom: 2px solid #ddd;
    }

    .header p {
      margin: 2px 0;
      font-size: 18px;
      font-weight: bold;
    }

    /* شريط الكتابة */
    .marquee {
      background: #2e7d32; /* أخضر بارد */
      color: white;
      padding: 10px;
      overflow: hidden;
      white-space: nowrap;
    }

    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: scroll 20s linear infinite; /* بطيء */
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* البطاقة */
    .login-container {
      max-width: 400px;
      margin: 40px auto;
      padding: 25px;
      border-radius: 16px;
      background: #fdfdfd;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      text-align: center;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeInUp 1s ease forwards; /* حركة سلسة */
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-container input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: 'Cairo', sans-serif;
      transition: 0.3s;
    }

    .login-container input:focus {
      border-color: #1976d2;
      box-shadow: 0 0 6px rgba(25,118,210,0.4);
      outline: none;
    }

    .button-row {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn-login {
      background: #1976d2; /* أزرق */
    }

    .btn-register {
      background: #e91e63; /* وردي */
    }

    .btn:hover {
      transform: translateY(-3px);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <div class="header">
    <p>الجمهورية الجزائرية الديمقراطية الشعبية</p>
    <p>وزارة التربية الوطنية</p>
    <p>الديوان الوطني للتعليم والتكوين عن بعد</p>
  </div>

  <!-- الشريط المتحرك -->
  <div class="marquee">
    <span>أهلا بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</span>
  </div>

  <!-- نموذج تسجيل الدخول كبطاقة -->
  <div class="login-container">
    <input type="text" placeholder="رقم التسجيل">
    <input type="password" placeholder="الرقم السري">

    <div class="button-row">
      <button class="btn btn-login">تسجيل الدخول</button>
      <button class="btn btn-register">تسجيل جديد</button>
    </div>
  </div>

</body>
</html>
