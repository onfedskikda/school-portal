<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الطالب</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: "Cairo", sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1a73e8, #00c6ff);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    .container, .dashboard {
      background: rgba(255,255,255,0.15);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px rgba(0,0,0,0.2);
      width: 350px; text-align: center;
      animation: fadeIn 1.5s ease;
    }
    h2 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 1.5rem;
      animation: slideDown 1.2s ease;
    }
    .input-box { margin: 20px 0; animation: slideUp 1s ease; }
    .input-box input {
      width: 100%; padding: 12px;
      border: none; border-radius: 10px;
      background: rgba(255,255,255,0.2);
      color: #fff; font-size: 1rem; outline: none;
    }
    .btn {
      width: 100%; padding: 12px;
      background: #00c6ff; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: bold; color: #fff;
      cursor: pointer; margin-top: 15px; transition: 0.3s;
      animation: bounceIn 1.3s ease;
    }
    .btn:hover { background: #0099cc; }
    .hidden { display: none; }
    /* الخانات بعد الدخول */
    .options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }
    .option {
      background: rgba(255,255,255,0.25);
      padding: 15px;
      border-radius: 12px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      opacity: 0;
      transform: translateY(30px);
      animation: popUp 0.8s forwards;
    }
    .option:hover { background: rgba(0,0,0,0.2); }
    /* حركات */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideDown {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes popUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .option:nth-child(1) { animation-delay: 0.2s; }
    .option:nth-child(2) { animation-delay: 0.4s; }
    .option:nth-child(3) { animation-delay: 0.6s; }
    .option:nth-child(4) { animation-delay: 0.8s; }
    .option:nth-child(5) { animation-delay: 1s; }
    .option:nth-child(6) { animation-delay: 1.2s; }
  </style>
</head>
<body>
  <!-- واجهة الدخول -->
  <div class="container" id="login">
    <h2>ادخل بياناتك للمتابعة</h2>
    <div class="input-box">
      <input type="text" id="username" placeholder="اسم المستخدم">
    </div>
    <div class="input-box">
      <input type="password" id="password" placeholder="كلمة المرور">
    </div>
    <button class="btn" onclick="login()">دخول</button>
  </div>

  <!-- لوحة الطالب -->
  <div class="dashboard hidden" id="dashboard">
    <h2>مرحبا بك</h2>
    <div class="options">
      <div class="option">📘 تسجيلاتي</div>
      <div class="option">📄 كشوف النقاط</div>
      <div class="option">📝 نماذج الفروض والاختبارات</div>
      <div class="option">📊 نتائج المراقبة المستمرة والفروض والاختبارات</div>
      <div class="option">🔄 طلبات التحويل</div>
      <div class="option">❓ طرح إشكاليات</div>
    </div>
  </div>

  <script>
    function login() {
      document.getElementById("login").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
    }
  </script>
</body>
</html>
