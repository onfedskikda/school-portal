<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فضاء التلميذ</title>
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Algeria_location_map.svg/800px-Algeria_location_map.svg.png') no-repeat center center/cover;
      position: relative;
      color: white;
    }

    /* طبقة مظللة فوق الخريطة */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55); /* ظل شفاف */
      z-index: 0;
    }

    .overlay {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 15px;
      width: 360px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      color: #222;
    }

    h1 {
      color: #006d5b;
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #444;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .login-box input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .login-box button {
      background-color: #006d5b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      width: 95%;
      margin-top: 10px;
    }

    .login-box button:hover {
      background-color: #004f43;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="logo">📚</div>
    <h1>فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</h1>
    <p>منصة لمتابعة النتائج، التسجيلات، وكشوف النقاط.</p>

    <div class="login-box">
      <h2 style="margin-bottom:15px;">تسجيل الدخول</h2>
      <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <input type="text" placeholder="البريد الإلكتروني أو رقم التسجيل" required>
        <input type="password" placeholder="كلمة المرور" required>
        <button type="submit">دخول</button>
      </form>
    </div>
  </div>
</body>
</html>
