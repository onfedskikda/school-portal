<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التلميذ</title>
  <!-- خط عصري -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #f9fafb, #eef2f7);
      color: #333;
    }

    header {
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      color: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      border-bottom: 4px solid #00d2ff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(135deg, rgba(79,172,254,0.15), rgba(0,242,254,0.15));
      transform: rotate(25deg);
      transition: 0.5s;
      z-index: 0;
    }

    .card:hover::before {
      transform: rotate(0deg);
      opacity: 0.6;
    }

    .icon {
      font-size: 45px;
      margin-bottom: 15px;
      z-index: 1;
      position: relative;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      z-index: 1;
      position: relative;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }

    footer {
      background: #f1f3f5;
      color: #555;
      text-align: center;
      padding: 15px;
      margin-top: 50px;
      font-size: 14px;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <header>
    📚 لوحة التلميذ
  </header>

  <div class="container">
    <div class="card">
      <div class="icon">📘</div>
      <div class="title">تسجيلاتي</div>
    </div>

    <div class="card">
      <div class="icon">📑</div>
      <div class="title">كشوف النقاط</div>
    </div>

    <div class="card">
      <div class="icon">✏️</div>
      <div class="title">نماذج الفروض والاختبارات</div>
    </div>

    <div class="card">
      <div class="icon">📊</div>
      <div class="title">نتائج المراقبة المستمرة والفروض والاختبارات</div>
    </div>

    <div class="card">
      <div class="icon">📂</div>
      <div class="title">طلبات التحويل</div>
    </div>

    <div class="card">
      <div class="icon">❓</div>
      <div class="title">طرح إشكاليات</div>
    </div>
  </div>

  <footer>
    © 2025 - موقع التلميذ
  </footer>

</body>
</html>
