<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ</title>
  <!-- خط Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background: url('https://img.freepik.com/free-photo/back-school-concept-with-colorful-supplies_23-2148639129.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.85);
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      width: 95%;
      max-width: 600px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      animation: slideDown 1s ease;
    }
    @keyframes slideDown {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
    }
    .header img {
      height: 60px;
    }
    .header-text {
      text-align: right;
      font-size: 14px;
      line-height: 1.5;
    }
    .marquee {
      background: #a8d5ba; /* أخضر بارد */
      color: #004d40;
      padding: 10px;
      margin: 15px 0;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .marquee span {
      display: inline-block;
      white-space: nowrap;
      animation: scrollText 12s linear infinite;
    }
    @keyframes scrollText {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    input {
      display: block;
      width: 90%;
      margin: 10px auto;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    .buttons {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
    }
    .buttons button {
      flex: 1;
      margin: 0 5px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }
    .blue { background: #1976d2; }
    .blue:hover { background: #0d47a1; }
    .pink { background: #e91e63; }
    .pink:hover { background: #ad1457; }
    .yellow { background: #fbc02d; }
    .yellow:hover { background: #f57f17; }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .success { background: #c8e6c9; color: #256029; }
    .error { background: #ffcdd2; color: #c62828; }
  </style>
</head>
<body>
  <div class="card">
    <!-- الشعار + النص -->
    <div class="header">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Armoiries_de_l%27Alg%C3%A9rie.svg/120px-Armoiries_de_l%27Alg%C3%A9rie.svg.png" alt="شعار الجزائر">
      <div class="header-text">
        <div>الجمهورية الجزائرية الديمقراطية الشعبية</div>
        <div>وزارة التربية الوطنية</div>
        <div>الديوان الوطني للتعليم والتكوين عن بعد</div>
      </div>
    </div>

    <!-- الشريط المتحرك -->
    <div class="marquee">
      <span>مرحباً بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</span>
    </div>

    <!-- خانات الدخول -->
    <input type="text" id="username" placeholder="رقم التسجيل">
    <input type="password" id="password" placeholder="الرقم السري">

    <div class="buttons">
      <button class="blue" onclick="login()">تسجيل الدخول</button>
      <button class="pink">تسجيل جديد</button>
      <button class="yellow">إستعادة كلمة المرور</button>
    </div>

    <!-- رسائل -->
    <div id="message" class="message"></div>
  </div>

  <script>
    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      const msg = document.getElementById("message");

      if (user === "21202505167" && pass === "21Ut17174L#U") {
        msg.textContent = "✔ تم تسجيل الدخول بنجاح";
        msg.className = "message success";
        msg.style.display = "block";
      } else {
        msg.textContent = "❌ رقم التسجيل أو كلمة المرور خاطئة";
        msg.className = "message error";
        msg.style.display = "block";
      }
    }
  </script>
</body>
</html>
