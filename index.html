<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #e0f7fa, #ffffff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card {
      background: #fff;
      width: 400px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      animation: slideUp 1.2s ease forwards;
      opacity: 0;
      transform: translateY(50px);
    }
    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .card header {
      text-align: center;
      padding: 20px;
      border-bottom: 2px solid #eee;
    }
    .card header img {
      height: 60px;
      vertical-align: middle;
      margin-left: 10px;
    }
    .card header h2, .card header h3 {
      margin: 5px 0;
      font-size: 16px;
    }
    .banner {
      background: #80cbc4;
      color: #004d40;
      padding: 10px;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .banner span {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 10s linear infinite;
      font-weight: bold;
    }
    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }
    .form {
      padding: 20px;
      text-align: center;
    }
    .form input {
      width: 90%;
      margin: 10px 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    .form button {
      width: 95%;
      padding: 12px;
      background: #00796b;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.3s;
    }
    .form button:hover {
      background: #004d40;
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/48/Coat_of_arms_of_Algeria.svg/1024px-Coat_of_arms_of_Algeria.svg.png" alt="شعار">
      <h2>الجمهورية الجزائرية الديمقراطية الشعبية</h2>
      <h3>وزارة التربية الوطنية</h3>
    </header>
    <div class="banner">
      <span>مرحباً بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</span>
    </div>
    <div class="form">
      <input type="text" placeholder="اسم المستخدم" required>
      <input type="password" placeholder="كلمة المرور" required>
      <button type="submit">تسجيل الدخول</button>
    </div>
  </div>
</body>
</html>
