<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الديوان الوطني للتعليم والتكوين عن بعد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* البطاقة في أعلى الصفحة */
        .premium-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.85));
            backdrop-filter: blur(20px);
            border-radius: 0 0 25px 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            padding: 30px 40px 40px 40px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* الشريط المتحرك داخل البطاقة - بدون ظل */
        .moving-text-container {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            margin: -30px -40px 30px -40px;
            padding: 15px;
            border-radius: 0 0 20px 20px;
            border-bottom: 3px solid #8e44ad;
            overflow: hidden;
        }

        .premium-moving-text {
            color: #8e44ad;
            font-weight: 700;
            font-size: 18px;
            white-space: nowrap;
            animation: premiumMove 15s linear infinite;
            /* تم إزالة text-shadow */
        }

        @keyframes premiumMove {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* العناوين بخط مشابه للرسمي */
        .premium-logo-section {
            margin-bottom: 30px;
        }

        .premium-national {
            color: #2c3e50;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 5px;
            font-family: 'Cairo', sans-serif;
        }

        .premium-ministry {
            color: #34495e;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            font-family: 'Cairo', sans-serif;
        }

        .premium-office {
            color: #8e44ad;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 15px;
            font-family: 'Cairo', sans-serif;
        }

        .premium-welcome {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
            font-family: 'Cairo', sans-serif;
        }

        .premium-welcome::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 25%;
            width: 50%;
            height: 3px;
            background: linear-gradient(135deg, #3498db, #8e44ad);
            border-radius: 10px;
        }

        /* حقول الإدخال */
        .premium-form-group {
            margin-bottom: 25px;
            text-align: right;
            position: relative;
        }

        .premium-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            font-size: 16px;
            background: #f8f9fa;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .premium-input:focus {
            border-color: #3498db;
            background: white;
            outline: none;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
            transform: translateY(-2px);
        }

        /* الخانات الثلاث جنب بعض */
        .buttons-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .login-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
            font-family: 'Cairo', sans-serif;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #2980b9, #1f618d);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.6);
        }

        .register-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', sans-serif;
        }

        .register-btn:hover {
            background: linear-gradient(135deg, #27ae60, #219652);
            transform: translateY(-2px);
        }

        .forgot-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', sans-serif;
        }

        .forgot-btn:hover {
            background: linear-gradient(135deg, #c0392b, #a93226);
            transform: translateY(-2px);
        }

        /* رسالة الخطأ */
        .error-message {
            color: #e74c3c;
            background: #fadbd8;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
            border: 1px solid #e74c3c;
            text-align: center;
            font-family: 'Cairo', sans-serif;
        }

        /* رسالة النجاح */
        .success-message {
            color: #27ae60;
            background: #d5f4e6;
            padding: 15px;
            border-radius: 10px;
            margin: 20px auto;
            display: none;
            font-weight: 700;
            border: 2px solid #27ae60;
            text-align: center;
            max-width: 400px;
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            color: #27ae60;
            font-size: 24px;
            margin-left: 10px;
        }

        /* الأيقونات */
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #7f8c8d;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- البطاقة في أعلى الصفحة -->
    <div class="premium-card">
        <!-- الشريط المتحرك داخل البطاقة - بدون ظل -->
        <div class="moving-text-container">
            <div class="premium-moving-text">
                <i class="fas fa-star"></i> مرحباً بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد <i class="fas fa-star"></i>
            </div>
        </div>

        <!-- العناوين -->
        <div class="premium-logo-section">
            <div class="premium-national">الجمهورية الجزائرية الديمقراطية الشعبية</div>
            <div class="premium-ministry">وزارة التربية الوطنية</div>
            <div class="premium-office">الديوان الوطني للتعليم والتكوين عن بعد</div>
            <div class="premium-welcome">مرحبا بكم في الأرضية الرقمية</div>
        </div>

        <!-- رسالة الخطأ -->
        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-triangle"></i> إسم المستخدم أو كلمة المرور خاطئة
        </div>

        <!-- نموذج التسجيل -->
        <form id="loginForm">
            <div class="premium-form-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" class="premium-input" id="username" placeholder="اسم المستخدم" required value="21202505167">
            </div>

            <div class="premium-form-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" class="premium-input" id="password" placeholder="كلمة المرور" required value="21Ut17174L#U">
            </div>

            <!-- الخانات الثلاث جنب بعض -->
            <div class="buttons-container">
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
                
                <a href="#" class="register-btn">
                    <i class="fas fa-user-plus"></i> تسجيل جديد
                </a>
                
                <a href="#" class="forgot-btn">
                    <i class="fas fa-key"></i> استعادة كلمة المرور
                </a>
            </div>
        </form>
    </div>

    <!-- رسالة النجاح -->
    <div class="success-message" id="successMessage">
        <i class="fas fa-check-circle success-icon"></i>
        تم تسجيل الدخول بنجاح
    </div>

    <script>
        // بيانات المستخدم الصحيحة
        const correctUsername = "21202505167";
        const correctPassword = "21Ut17174L#U";

        // إدارة نموذج التسجيل
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // التحقق من بيانات المستخدم
            if (username === correctUsername && password === correctPassword) {
                // إخفاء رسالة الخطأ إذا كانت ظاهرة
                errorMessage.style.display = 'none';
                
                // عرض رسالة النجاح
                successMessage.style.display = 'block';
                
                // التوجيه إلى الصفحة التالية بعد 2 ثانية
                setTimeout(function() {
                    window.location.href = "dashboard.html"; // غير هذا الرابط إلى الصفحة التالية
                }, 2000);
                
            } else {
                // عرض رسالة الخطأ وإخفاء رسالة النجاح
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            }
        });

        // إخفاء رسالة الخطأ عند الكتابة
        document.getElementById('username').addEventListener('input', function() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        });

        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        });
    </script>
</body>
</html>
