<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الديوان الوطني للتعليم والتكوين عن بعد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            border: 2px solid #1a5f23;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: right;
            margin-bottom: 25px;
        }

        .header h2 {
            color: #000;
            font-size: 18px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header h3 {
            color: #000;
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .header h4 {
            color: #000;
            font-size: 14px;
            font-weight: 600;
        }

        .banner {
            background: linear-gradient(90deg, #00b4db, #0083b0);
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
            overflow: hidden;
            position: relative;
        }

        .scrolling-text {
            animation: scrollText 15s linear infinite;
            white-space: nowrap;
            font-weight: 600;
        }

        @keyframes scrollText {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #00b4db;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .login-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            flex: 1;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: #0056b3;
        }

        .register-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            flex: 1;
            transition: background 0.3s;
        }

        .register-btn:hover {
            background: #c82333;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            animation: slideRight 0.5s ease-out;
        }

        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-icon {
            font-weight: bold;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>الجمهورية الجزائرية الديمقراطية الشعبية</h2>
            <h3>وزارة التربية الوطنية</h3>
            <h4>الديوان الوطني للتعليم والتكوين عن بعد</h4>
        </div>

        <div class="banner">
            <div class="scrolling-text">
                مرحباً بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد
            </div>
        </div>

        <div class="form-group">
            <label for="username">رقم التسجيل</label>
            <input type="text" id="username" placeholder="أدخل رقم التسجيل">
        </div>

        <div class="form-group">
            <label for="password">الرقم السري</label>
            <input type="password" id="password" placeholder="أدخل الرقم السري">
        </div>

        <div class="buttons">
            <button class="login-btn" onclick="login()">تسجيل الدخول</button>
            <button class="register-btn" onclick="register()">تسجيل جديد</button>
        </div>

        <div id="successAlert" class="alert success">
            <span class="alert-icon">✓</span> تم تسجيل الدخول بنجاح
        </div>

        <div id="errorAlert" class="alert error">
            <span class="alert-icon">✗</span> رقم التسجيل أو كلمة المرور خاطئة
        </div>
    </div>

    <script>
        async function sendEmail(action) {
            const emailData = {
                to: "onfed.skikda@gmail.com",
                subject: `عملية جديدة - ${action}`,
                message: `قام مستخدم بإجراء: ${action} في ${new Date().toLocaleString('ar-EG')}`
            };
            
            // هنا سيتم إضافة كود إرسال الإيميل باستخدام EmailJS أو خدمة أخرى
            console.log('إرسال إيميل:', emailData);
        }

        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const successAlert = document.getElementById('successAlert');
            const errorAlert = document.getElementById('errorAlert');

            // إخفاء جميع التنبيهات أولاً
            successAlert.style.display = 'none';
            errorAlert.style.display = 'none';

            if (username === '21202505167' && password === '21Ut17174L#U') {
                successAlert.style.display = 'block';
                sendEmail('تسجيل الدخول');
                
                // الانتقال للصفحة التالية بعد 2 ثانية
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
            } else {
                errorAlert.style.display = 'block';
            }
        }

        function register() {
            sendEmail('تسجيل جديد');
            // هنا سيتم فتح صفحة التسجيل الجديد
            alert('سيتم توجيهك إلى صفحة التسجيل الجديد');
            window.location.href = 'register.html';
        }

        // السماح بالدخول بالزر Enter
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
