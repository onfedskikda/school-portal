<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ</title>
  <!-- استدعاء خط مشابه لموقع الوزارة -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: url("https://i.ibb.co/DLczm2p/bg-education.jpg") no-repeat center center fixed;
      background-size: cover;
    }
    .overlay {
      background: rgba(255, 255, 255, 0.9);
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      width: 380px;
      padding: 25px;
      background: #fff;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.25);
      border-radius: 10px;
      text-align: center;
    }
    .login-box h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #222;
      line-height: 1.6;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .login-box button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="login-box">
      <h2>مرحباً بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</h2>
      <form>
        <input type="text" placeholder="البريد الإلكتروني" required>
        <input type="password" placeholder="كلمة المرور" required>
        <button type="submit">دخول</button>
      </form>
    </div>
  </div>
</body>
</html>
