<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* صفحة تسجيل الدخول */
    #login-page {
      text-align: center;
      animation: fadeIn 1.5s ease;
    }
    #login-page img {
      width: 120px;
      margin-bottom: 15px;
      animation: float 3s ease-in-out infinite;
    }
    #login-page h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }
    #login-page p {
      opacity: 0.9;
      margin-bottom: 20px;
    }
    .login-box {
      background: rgba(255,255,255,0.1);
      padding: 25px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
      width: 300px;
      margin: auto;
    }
    .login-box input {
      width: 90%;
      margin: 10px auto;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      display: block;
    }
    .login-box button {
      background: #FF9800;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      transition: 0.3s;
    }
    .login-box button:hover {
      background: #e68900;
    }

    /* صفحة الداشبورد */
    #dashboard {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      animation: fadeIn 1.5s ease;
    }
    header {
      background: rgba(0,0,0,0.3);
      width: 100%;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .dashboard-grid {
      margin-top: 30px;
      width: 90%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      color: #333;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
      transform: rotate(25deg);
      transition: opacity 0.3s;
      opacity: 0;
    }
    .card:hover::before {
      opacity: 1;
    }

    /* ألوان الخانات */
    .card1 { border-top: 6px solid #FF9800; }
    .card2 { border-top: 6px solid #4CAF50; }
    .card3 { border-top: 6px solid #2196F3; }
    .card4 { border-top: 6px solid #E91E63; }
    .card5 { border-top: 6px solid #9C27B0; }
    .card6 { border-top: 6px solid #FFC107; }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- صفحة تسجيل الدخول -->
  <div id="login-page">
    <img src="https://cdn-icons-png.flaticon.com/512/29/29302.png" alt="كتب">
    <h1>مرحباً بكم في فضاء التلميذ</h1>
    <p>الديوان الوطني للتعليم والتكوين عن بعد</p>
    <div class="login-box">
      <h2>تسجيل الدخول</h2>
      <input type="text" id="username" placeholder="رقم التسجيل" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button onclick="login()">دخول</button>
    </div>
  </div>

  <!-- صفحة الداشبورد -->
  <div id="dashboard">
    <header>📚 لوحة التلميذ</header>
    <div class="dashboard-grid">
      <div class="card card1">📘 تسجيلاتي</div>
      <div class="card card2">📄 كشوف النقاط</div>
      <div class="card card3">📝 نماذج الفروض والإختبارات</div>
      <div class="card card4">📊 نتائج المراقبة المستمرة</div>
      <div class="card card5">🔄 طلبات التحويل</div>
      <div class="card card6">❓ طرح إشكاليات</div>
    </div>
  </div>

  <script>
    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      // تحقق بسيط
      if(user === "21202505167" && pass === "21Ut17174L#U") {
        document.getElementById("login-page").style.display = "none";
        document.getElementById("dashboard").style.display = "flex";
      } else {
        alert("❌ بيانات الدخول غير صحيحة!");
      }
    }
  </script>

</body>
</html>
