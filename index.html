<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(to bottom, #006699, #33ccff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
      width: 320px;
    }
    h2 {
      margin-bottom: 20px;
      color: #004466;
      font-size: 18px;
    }
    input {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #006699;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #004466;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>مرحباً بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</h2>
    <form onsubmit="return checkLogin(event)">
      <input type="text" id="username" placeholder="إسم المستخدم" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button type="submit">تسجيل الدخول</button>
    </form>
  </div>

  <script>
    function checkLogin(event) {
      event.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      if (u === "21202505167" && p === "21Ut17174L#U") {
        window.location.href = "dashboard.html";
      } else {
        alert("⚠️ معلومات الدخول غير صحيحة!");
      }
    }
  </script>
</body>
</html>
