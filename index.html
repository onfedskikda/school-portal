<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فضاء التلميذ</title>

  <!-- استدعاء خط "Cairo" من Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- القسم العلوي: صورة + العلم + النص -->
    <div class="header">
      <img src="https://img.freepik.com/free-photo/library-with-books_1232-3936.jpg" alt="مكتبة" class="header-img">
      <img src="https://upload.wikimedia.org/wikipedia/commons/7/77/Flag_of_Algeria.svg" alt="علم الجزائر" class="flag">
      <div class="welcome-text">
        <h2>فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</h2>
        <p>منصة لمتابعة نتائج التلاميذ، الغيابات، المواعيد وطلبات التحويل.</p>
        <p>أدخل بياناتك الموثقة للدخول إلى الخدمات الرقمية للمدرسة.</p>
      </div>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <div class="login-box">
      <h3>تسجيل الدخول</h3>
      <form action="dashboard.html" method="GET">
        <input type="text" placeholder="البريد الإلكتروني (مثال: @21202505167)" required>
        <input type="password" placeholder="كلمة المرور" required>
        <button type="submit">دخول</button>
      </form>
    </div>
  </div>
</body>
</html>
