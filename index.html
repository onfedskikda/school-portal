<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background: url('https://upload.wikimedia.org/wikipedia/commons/7/77/Algeria_relief_location_map.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.8);
      z-index: 0;
    }
    .content {
      position: relative;
      z-index: 1;
      padding: 30px;
    }
    header img {
      height: 80px;
      margin: 10px;
    }
    h1 {
      color: #00796b;
      margin: 15px 0;
    }
    p {
      color: #333;
      font-size: 18px;
      margin-bottom: 25px;
    }
    .login-box {
      background: #ffffffcc;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      max-width: 350px;
      margin: auto;
    }
    .login-box h2 {
      margin-bottom: 20px;
      color: #00796b;
    }
    .login-box input {
      display: block;
      width: 90%;
      margin: 10px auto;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    .login-box button {
      background: #00796b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    .login-box button:hover {
      background: #004d40;
    }
  </style>
</head>
<body>
  <div class="content">
    <header>
      <img src="https://cdn-icons-png.flaticon.com/512/29/29302.png" alt="كتب">
      <h1>فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</h1>
      <p>منصة لمتابعة النتائج، التسجيلات، وكشوف النقاط.</p>
    </header>

    <div class="login-box">
      <h2>أدخل بياناتك للمتابعة</h2>
      <form action="dashboard.html" method="get">
        <input type="text" required>
        <input type="password" required>
        <button type="submit">دخول</button>
      </form>
    </div>
  </div>
</body>
</html>
