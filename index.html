<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فضاء التلميذ</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
      background: #f2f4f5; /* رمادي بارد جدا */
    }

    .card {
      width: 420px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      animation: slideDown 1s ease forwards;
    }

    @keyframes slideDown {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .header {
      display: flex;
      justify-content: flex-start; /* الكتابة على اليمين */
      align-items: center;
      margin-bottom: 15px;
    }

    .header-text {
      text-align: right;
      font-size: 14px;
      line-height: 1.6;
      color: #000;
    }

    .marquee {
      background: #2ecc71; /* أخضر بارد */
      color: #000; /* أسود */
      padding: 6px;
      border-radius: 6px;
      overflow: hidden;
      white-space: nowrap;
      margin-bottom: 20px;
    }

    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 15s linear infinite; /* بطيئة */
    }

    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .btn {
      flex: 1;
      margin: 0 5px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn.blue { background: #3498db; }
    .btn.pink { background: #e84393; }
    .btn.yellow { background: #f1c40f; }

    .btn:hover { opacity: 0.85; }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .success { background: #2ecc71; color: #fff; }
    .error { background: #e74c3c; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="header-text">
        الجمهورية الجزائرية الديمقراطية الشعبية <br>
        وزارة التربية الوطنية <br>
        الديوان الوطني للتعليم والتكوين عن بعد
      </div>
    </div>

    <div class="marquee">
      <span>مرحباً بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</span>
    </div>

    <input type="text" id="username" placeholder="رقم التسجيل">
    <input type="password" id="password" placeholder="الرقم السري">

    <div class="message success" id="successMsg">تم تسجيل الدخول بنجاح ✔️</div>
    <div class="message error" id="errorMsg">رقم التسجيل أو كلمة المرور خاطئة ❌</div>

    <div class="buttons">
      <button class="btn blue" onclick="login()">تسجيل الدخول</button>
      <button class="btn pink" onclick="alert('التوجه إلى صفحة التسجيل الجديد')">تسجيل جديد</button>
      <button class="btn yellow" onclick="alert('استعادة كلمة المرور')">استعادة كلمة المرور</button>
    </div>
  </div>

  <script>
    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      const successMsg = document.getElementById("successMsg");
      const errorMsg = document.getElementById("errorMsg");

      successMsg.style.display = "none";
      errorMsg.style.display = "none";

      if (user === "21202505167" && pass === "21Ut17174L#U") {
        successMsg.style.display = "block";
      } else {
        errorMsg.style.display = "block";
      }
    }
  </script>
</body>
</html>
