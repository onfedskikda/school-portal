<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فضاء التلميذ</title>
  <!-- خط Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Cairo', sans-serif;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: url('https://i.ibb.co/wWfKYg5/school-tools.jpg') no-repeat center center/cover;
    }

    .card {
      width: 90%;
      max-width: 600px;
      margin: 20px auto;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      animation: slideUp 0.8s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .header img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .header-text {
      display: flex;
      flex-direction: column;
    }

    .header-text strong {
      font-size: 14px;
    }

    .marquee {
      background: #00897B; /* أخضر بارد جداً */
      color: #0000ff;
      padding: 5px;
      margin: 10px 0;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      border-radius: 6px;
    }

    .marquee span {
      display: inline-block;
      padding-right: 100%;
      animation: marquee 10s linear infinite;
    }

    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .input-box {
      margin: 10px 0;
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .btn.blue { background: #007BFF; }
    .btn.pink { background: #FF69B4; }
    .btn.yellow { background: #FFD700; color: #000; }

    .message {
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .success { background: #c8e6c9; color: #2e7d32; }
    .error { background: #ffcdd2; color: #c62828; }
  </style>
</head>
<body>
  <div class="card">
    <!-- الشعار + النصوص -->
    <div class="header">
      <img src="https://i.ibb.co/2ZVZfQd/logo.png" alt="شعار">
      <div class="header-text">
        <strong>الجمهورية الجزائرية الديمقراطية الشعبية</strong>
        <span>وزارة التربية الوطنية</span>
        <span>الديوان الوطني للتعليم والتكوين عن بعد</span>
      </div>
    </div>

    <!-- الشريط المتحرك -->
    <div class="marquee">
      <span>مرحباً بكم في فضاء التلميذ - الديوان الوطني للتعليم والتكوين عن بعد</span>
    </div>

    <!-- خانات التسجيل -->
    <input type="text" id="regNum" class="input-box" placeholder="رقم التسجيل">
    <input type="password" id="password" class="input-box" placeholder="كلمة المرور">

    <div class="message" id="messageBox"></div>

    <!-- الأزرار -->
    <div class="buttons">
      <button class="btn blue" onclick="login()">تسجيل الدخول</button>
      <button class="btn pink">تسجيل جديد</button>
      <button class="btn yellow">استعادة كلمة المرور</button>
    </div>
  </div>

  <script>
    function login() {
      const regNum = document.getElementById("regNum").value;
      const password = document.getElementById("password").value;
      const msgBox = document.getElementById("messageBox");

      if (regNum === "21202505167" && password === "21Ut17174L#U") {
        msgBox.innerText = "✔ تم تسجيل الدخول بنجاح";
        msgBox.className = "message success";
        msgBox.style.display = "block";
      } else {
        msgBox.innerText = "❌ رقم التسجيل أو كلمة المرور خاطئة";
        msgBox.className = "message error";
        msgBox.style.display = "block";
      }
    }
  </script>
</body>
</html>
