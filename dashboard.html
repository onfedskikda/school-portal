<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التلميذ</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 0;
    }
    header {
      background: #006699;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .card:hover {
      background: #e6f7ff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <header>📚 لوحة التلميذ</header>
  <div class="container">
    <div class="card">📘 تسجيلاتي</div>
    <div class="card">📑 كشوف النقاط</div>
    <div class="card">📊 متابعة الغيابات</div>
    <div class="card">📝 الامتحانات</div>
    <div class="card">🔄 طلبات التحويل</div>
    <div class="card">📅 مواعيد المقابلات</div>
    <div class="card">📂 ملفات التلميذ</div>
    <div class="card">📨 المراسلات</div>
  </div>
</body>
</html>
